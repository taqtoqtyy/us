<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fb3">
<meta name="robots" content="noindex, nofollow">
<title>My Princess👑💕</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 8 240 224'%3E%3Cpath d='M120 214C40 150 14 108 14 74C14 40 40 20 70 20C92 20 110 32 120 50C130 32 148 20 170 20C200 20 226 40 226 74C226 108 200 150 120 214Z' fill='%23e0457a'/%3E%3Cpath d='M71 98H170L169 116Q168 124 160 124Q164 121 156 103L131 102V168H113V102L84 103Q81 112 76 115Q72 113 72 106Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Dancing+Script:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* One pink sky, one centered column. Gate -> question -> main page. The main page has a top nav and a slide-in menu; every feature opens inside the same page so the song never stops. */
:root {
  --sky-1: #ffc2d6;
  --sky-2: #ff8fb3;
  --sky-3: #f0668f;
  --ink: #6b123a;
  --card: rgba(255, 255, 255, 0.88);
  --line: #f3a1bd;
  --btn: #c92e69;
  --btn-hover: #b32559;
  --error: #a3123f;
  --night: #1b0611;
  --night-ink: #ffc2d6;
  --font-script: 'Dancing Script', 'Brush Script MT', cursive;
  --font-display: 'Aref Ruqaa', 'Noto Naskh Arabic', 'Amiri', serif;
  --font-body: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
  --nav-h: 56px;
}
[hidden] { display: none !important; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100%;
  margin: 0;
  display: grid;
  place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: var(--sky-2);
  background-image: radial-gradient(circle at 50% 28%, var(--sky-1) 0%, var(--sky-2) 55%, var(--sky-3) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  overflow-x: hidden;
}
body.main { place-items: start center; padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 18px); }
body.noscroll { overflow: hidden; }
#app { width: 100%; display: flex; justify-content: center; }
button { font-family: inherit; }

/* flying logos */
.hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.fh { position: absolute; left: var(--x); bottom: -110px; width: var(--s); height: auto; opacity: 0; will-change: transform, opacity; animation: rise var(--d) linear var(--delay) infinite; }
.fh.once { animation-iteration-count: 1; animation-fill-mode: both; }
@keyframes rise {
  0% { transform: translate3d(0, 0, 0) rotate(var(--r0)) scale(0.8); opacity: 0; }
  10% { opacity: var(--o); }
  88% { opacity: var(--o); }
  100% { transform: translate3d(var(--dx), calc(-100vh - 200px), 0) rotate(var(--r1)) scale(1.05); opacity: 0; }
}
.kb { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: auto; opacity: 0; animation: kb 2.6s ease-out forwards; }
@keyframes kb {
  0% { opacity: 0; transform: translate(-50%, 0) rotate(var(--r0)) scale(0.5); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-1 * var(--dist))) rotate(var(--r1)) scale(1.1); }
}

.stack { position: relative; z-index: 1; width: min(100%, 380px); display: flex; flex-direction: column; align-items: center; gap: 18px; }
.logo { width: min(64vw, 250px); height: auto; display: block; transform-origin: 50% 55%; animation: beat 1.5s ease-in-out infinite; transition: width 0.7s ease; }
body.main .logo { width: min(36vw, 150px); }
@keyframes beat {
  0% { transform: scale(1); }
  12% { transform: scale(1.1); }
  24% { transform: scale(1); }
  36% { transform: scale(1.07); }
  52% { transform: scale(1); }
  100% { transform: scale(1); }
}

.card { width: 100%; box-sizing: border-box; background: var(--card); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 28px; padding: 26px 22px 24px; box-shadow: 0 18px 50px rgba(176, 18, 79, 0.28); }
.card.shake { animation: shake 0.45s ease-in-out; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.panel { transition: opacity 0.5s ease, transform 0.5s ease; }
.panel.out { opacity: 0; transform: translateY(-8px) scale(0.98); pointer-events: none; }

.ask { display: block; font-family: var(--font-script); font-weight: 700; font-size: 36px; line-height: 1.3; text-align: center; margin-bottom: 14px; }
.field { position: relative; }
.field input { width: 100%; box-sizing: border-box; height: 56px; padding-inline: 16px 52px; border: 2px solid var(--line); border-radius: 16px; background: #ffffff; color: var(--ink); font-family: var(--font-body); font-size: 18px; font-weight: 500; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.field input.masked { -webkit-text-security: disc; text-security: disc; }
.field input::placeholder { color: #9b5b76; opacity: 1; }
.field input:focus-visible { border-color: var(--btn); box-shadow: 0 0 0 4px rgba(201, 46, 105, 0.22); }
.field.bad input { border-color: var(--error); }
.peek { position: absolute; inset-inline-end: 6px; top: 6px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); cursor: pointer; }
.peek:hover { background: rgba(240, 102, 143, 0.14); }
.peek:focus-visible, .go:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
.peek svg { width: 24px; height: 24px; }
.msg { min-height: 24px; margin: 10px 2px 0; font-size: 16px; font-weight: 500; color: var(--error); text-align: center; }
.go { width: 100%; height: 54px; margin-top: 8px; border: 0; border-radius: 16px; background: var(--btn); color: #ffffff; font-family: var(--font-script); font-weight: 700; font-size: 30px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
.go:hover { background: var(--btn-hover); }
.go:active { transform: scale(0.98); }
.go:disabled { opacity: 0.7; cursor: default; }

/* screen 2 */
.quiz { text-align: center; }
.quiz.in { animation: fadeUp 0.6s ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.q { margin: 0 0 18px; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.6; text-wrap: balance; }
.choices { display: flex; flex-direction: column; gap: 12px; }
.choice { width: 100%; min-height: 56px; padding: 8px 16px; border-radius: 16px; font-family: var(--font-body); font-weight: 700; font-size: 20px; cursor: pointer; transition: background 0.2s, transform 0.1s, opacity 0.2s, border-color 0.2s; }
.choice:active { transform: scale(0.98); }
.choice:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
.choice.main { border: 0; background: var(--btn); color: #ffffff; }
.choice.main:hover { background: var(--btn-hover); }
.choice.alt { border: 2px solid var(--line); background: #ffffff; color: var(--ink); }
.choice.alt:hover { background: #ffeaf1; }
.choice.good { border-color: #2e9d5b; background: #e6f7ec; }
.choices.locked .choice { opacity: 0.6; pointer-events: none; }

/* top message */
.toast { position: fixed; z-index: 30; top: max(14px, env(safe-area-inset-top, 0px)); left: 50%; width: min(calc(100% - 32px), 420px); box-sizing: border-box; padding: 14px 18px; border-radius: 18px; background: #ffffff; color: var(--ink); box-shadow: 0 12px 34px rgba(176, 18, 79, 0.35); font-family: var(--font-body); font-weight: 700; font-size: 19px; line-height: 1.55; text-align: center; opacity: 0; transform: translate(-50%, -24px); pointer-events: none; transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.3, 1.3, 0.5, 1); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* screen 3: opening effect */
.stage { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; margin-top: 6px; }
.name { display: flex; justify-content: center; white-space: nowrap; font-family: var(--font-script); font-weight: 700; line-height: 1.25; color: var(--ink); text-shadow: 0 2px 0 rgba(255, 255, 255, 0.35); }
.name span { display: inline-block; will-change: transform, opacity; }
.chunk { width: 100%; box-sizing: border-box; min-height: 0; padding: 22px 20px 24px; margin-top: 4px; border-radius: 22px; background: #ffffff; box-shadow: 0 10px 30px rgba(120, 10, 60, 0.18); color: var(--ink); font-family: var(--font-body); font-weight: 500; font-size: 20px; line-height: 1.95; text-align: start; opacity: 0; transition: opacity 0.6s ease; }
.chunk span { display: inline-block; margin: 0 0.15em; will-change: transform, opacity; scroll-margin-bottom: 96px; }
.chunk span.hid { visibility: hidden; }
.sign { font-family: var(--font-script); font-weight: 700; font-size: 34px; opacity: 0; transition: opacity 0.9s ease; min-height: 1.3em; }
.sign.show { opacity: 1; }
.tip { margin: 2px 0 0; font-size: 15px; font-weight: 700; opacity: 0; transition: opacity 0.8s ease; }
.tip.show { opacity: 0.85; }

/* controls */
.ctl { position: fixed; z-index: 20; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--ink); cursor: pointer; }
.ctl:hover { background: rgba(255, 255, 255, 0.8); }
.ctl:focus-visible, .burger:focus-visible, .brand:focus-visible, .mitem:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
.ctl svg { width: 22px; height: 22px; }
#mute { top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
body.main #mute { top: calc(env(safe-area-inset-top, 0px) + 6px); right: calc(max(10px, env(safe-area-inset-right, 0px)) + 52px); z-index: 26; background: transparent; }
#mute .off, #mute.muted .on { display: none; }
#mute.muted .off { display: block; }

/* nav + menu */
.nav { position: fixed; z-index: 25; top: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-top, 0px)); box-sizing: border-box; padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.5); }
.brand { border: 0; background: none; padding: 6px 4px; color: var(--ink); font-family: var(--font-script); font-weight: 700; font-size: 28px; cursor: pointer; white-space: nowrap; }
.burger { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); cursor: pointer; }
.burger svg { width: 26px; height: 26px; }
.burger.hint { animation: beat 1.5s ease-in-out infinite; }
.scrim { position: fixed; inset: 0; z-index: 27; background: rgba(107, 18, 58, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.menu { position: fixed; z-index: 28; top: 0; right: 0; bottom: 0; width: min(82vw, 320px); box-sizing: border-box; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 24px; background: rgba(255, 245, 249, 0.97); box-shadow: -12px 0 40px rgba(120, 10, 60, 0.3); transform: translateX(105%); visibility: hidden; transition: transform 0.35s cubic-bezier(0.3, 0.9, 0.3, 1), visibility 0s 0.35s; overflow-y: auto; }
.menu.on { transform: none; visibility: visible; transition: transform 0.35s cubic-bezier(0.3, 0.9, 0.3, 1); }
.mhead { margin: 4px 4px 12px; font-family: var(--font-script); font-weight: 700; font-size: 36px; }
.menu ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mitem { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 0; border-radius: 14px; background: #ffffff; color: var(--ink); font-size: 18px; font-weight: 700; text-align: start; cursor: pointer; }
.mitem:hover { background: #ffe3ed; }
.mitem.on { background: var(--btn); color: #ffffff; }
.mitem i { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #ffd3e2; color: var(--ink); font-style: normal; font-size: 14px; }
.mitem.on i { background: rgba(255, 255, 255, 0.25); color: #ffffff; }

/* next */
.nextbtn { position: fixed; z-index: 24; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); min-width: 140px; height: 48px; padding: 0 30px; border: 0; border-radius: 26px; background: var(--btn); color: #ffffff; font-family: var(--font-body); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; cursor: pointer; box-shadow: 0 10px 26px rgba(176, 18, 79, 0.45); animation: nextin 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) both; -webkit-tap-highlight-color: transparent; }
.nextbtn[hidden] { display: none; }
.nextbtn:active { transform: translateX(-50%) scale(0.97); }
.nextbtn:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
@keyframes nextin { from { opacity: 0; transform: translate(-50%, 24px) scale(0.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

/* views */
.view { position: relative; z-index: 1; width: min(100%, 420px); padding-bottom: 100px; }
.vh { margin: 0 0 14px; font-family: var(--font-script); font-weight: 700; font-size: 42px; line-height: 1.2; text-align: center; }
.vbody { animation: fadeUp 0.45s ease-out both; }
.hint-t { margin: 10px 0 0; text-align: center; font-size: 15px; font-weight: 700; opacity: 0.85; }
.panel-night { position: relative; overflow: hidden; border-radius: 24px; background: var(--night); color: var(--night-ink); box-shadow: 0 18px 50px rgba(120, 10, 60, 0.35); }
.disp { font-family: var(--font-display); font-weight: 700; }
.paperc { background: #fffdf7; border-radius: 8px; box-shadow: 0 12px 30px rgba(120, 10, 60, 0.28); }

/* envelope */
.envwrap { position: relative; display: flex; flex-direction: column; align-items: center; min-height: 360px; }
.env { position: relative; width: min(300px, 90%); height: 190px; margin: 90px 0 0; transition: opacity 0.6s ease; }
.env.gone { opacity: 0; pointer-events: none; }
.env-back { position: absolute; inset: 0; background: #ffb9d0; border-radius: 10px; box-shadow: 0 10px 28px rgba(160, 20, 80, 0.25); }
.letter { position: absolute; left: 14px; right: 14px; top: 12px; bottom: 10px; z-index: 1; background: #fffdf7; border-radius: 6px; display: grid; place-items: center; transition: transform 1s cubic-bezier(0.3, 0.9, 0.3, 1) 0.35s; }
.letter svg { width: 54px; height: auto; opacity: 0.9; }
.env-front { position: absolute; inset: 0; z-index: 2; background: #ffd6e4; border-radius: 10px; clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); }
.flap { position: absolute; left: 0; right: 0; top: 0; height: 110px; z-index: 3; background: linear-gradient(#ffc2d6, #ffb0cb); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform 0.7s ease, z-index 0s 0.35s; }
.seal { position: absolute; left: 50%; top: 108px; width: 80px; height: 80px; margin: -40px 0 0 -40px; padding: 0; border: 0; background: none; z-index: 4; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
.seal .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.seal .ring circle { fill: none; stroke: #6b123a; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 226.2; stroke-dashoffset: 226.2; }
.wax { position: absolute; left: 14px; top: 14px; width: 52px; height: 52px; }
.wax i { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; font-style: normal; font-family: var(--font-script); font-weight: 700; font-size: 30px; color: #ffd9e6; background: radial-gradient(circle at 35% 30%, #e8548a, #b3225a); box-shadow: 0 3px 8px rgba(100, 10, 50, 0.4); transition: transform 0.6s ease, opacity 0.6s ease; }
.wax .hl { clip-path: inset(0 50% 0 0); }
.wax .hr { clip-path: inset(0 0 0 50%); }
.env.open .letter { transform: translateY(-112px); }
.env.open .flap { transform: rotateX(180deg); z-index: 0; }
.env.open .wax .hl { transform: translate(-22px, 14px) rotate(-18deg); opacity: 0; }
.env.open .wax .hr { transform: translate(22px, 14px) rotate(18deg); opacity: 0; }
.envwrap .paperc { position: relative; width: 100%; box-sizing: border-box; padding: 26px 22px 22px; text-align: center; animation: fadeUp 0.9s ease-out both; }
.envwrap .ptext { margin: 0 0 14px; font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.95; }
.envwrap .psign { margin: 0; font-family: var(--font-script); font-weight: 700; font-size: 34px; }

/* moments: hearts + carousel */
.cats { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.catrow { display: flex; gap: 8px; width: 100%; scroll-margin-top: calc(var(--nav-h) + 12px); }
.catbtn { flex: 1 1 0; min-width: 0; min-height: 92px; padding: 10px 4px 8px; border: 2px solid rgba(255, 255, 255, 0.75); border-radius: 18px; background: rgba(255, 255, 255, 0.86); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.35; text-align: center; box-shadow: 0 6px 16px rgba(120, 10, 60, 0.15); transition: background 0.25s, color 0.25s, transform 0.2s, border-color 0.25s; -webkit-tap-highlight-color: transparent; }
.catbtn .cb-ico { width: 26px; display: block; }
.catbtn .cb-ico svg { display: block; width: 100%; height: auto; }
.catbtn:active { transform: scale(0.97); }
.catbtn.on { background: var(--btn); border-color: var(--btn); color: #ffffff; box-shadow: 0 8px 20px rgba(176, 18, 79, 0.4); }
.catbtn:focus-visible { outline: 3px solid var(--btn); outline-offset: 3px; }
.catpanels { width: 100%; }
.cat { display: flex; flex-direction: column; align-items: center; text-align: center; }
.cdesc { margin: 4px 0 0; font-size: 18px; font-weight: 500; line-height: 1.7; max-width: 340px; }
.slot { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.car { position: relative; width: min(72vw, 290px); aspect-ratio: 3 / 4; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
.pcard { position: absolute; inset: 0; box-sizing: border-box; padding: 8px; border-radius: 16px; background: #ffffff; box-shadow: 0 14px 34px rgba(120, 10, 60, 0.32); transition: transform 0.2s ease; will-change: transform; }
.pcard.drag { transition: none; }
.pcard img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 10px; background: #fff0f5; pointer-events: none; -webkit-user-drag: none; }
.pcard .pb { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); box-shadow: 0 6px 18px rgba(80, 0, 40, 0.35); pointer-events: none; }
.pcard .pb::after { content: ""; position: absolute; left: 23px; top: 17px; border-left: 19px solid var(--btn); border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.spin { position: absolute; left: 50%; top: 50%; width: 46px; margin: -23px 0 0 -23px; animation: beat 1s ease-in-out infinite; }
.cnt { margin: 0; font-size: 15px; font-weight: 700; direction: ltr; }

/* fullscreen viewer */
.viewer { position: fixed; inset: 0; z-index: 40; background: rgba(24, 4, 14, 0.985); display: flex; align-items: center; justify-content: center; touch-action: pan-y; animation: fade 0.25s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.vstage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 64px) 56px calc(env(safe-area-inset-bottom, 0px) + 28px); box-sizing: border-box; }
.vstage img, .vstage video { max-width: 100%; max-height: 100%; border-radius: 10px; background: #000; object-fit: contain; }
.vbtn { position: absolute; z-index: 2; width: 48px; height: 48px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.18); color: #ffffff; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.vbtn:hover { background: rgba(255, 255, 255, 0.3); }
.vbtn:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
.vbtn svg { width: 26px; height: 26px; }
.vprev { left: max(6px, env(safe-area-inset-left, 0px)); top: 50%; margin-top: -24px; }
.vnext { right: max(6px, env(safe-area-inset-right, 0px)); top: 50%; margin-top: -24px; }
.vclose { right: max(10px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 10px); }
.vcnt { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 22px); margin: 0; color: #ffd3e2; font-size: 16px; font-weight: 700; direction: ltr; }

/* reasons jar */
.jarwrap { position: relative; min-height: 470px; display: flex; flex-direction: column; align-items: center; }
.jcount { margin: 0 0 8px; font-size: 16px; font-weight: 700; direction: ltr; }
.drawn { position: relative; width: min(300px, 92%); min-height: 120px; box-sizing: border-box; padding: 16px 18px; border-radius: 18px; background: #ffffff; text-align: center; box-shadow: 0 12px 30px rgba(120, 10, 60, 0.28); font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.65; display: grid; align-content: center; gap: 4px; }
.drawn small { display: block; font-family: var(--font-body); font-size: 14px; letter-spacing: 0.04em; color: var(--btn); }
.drawn.pop { animation: popin 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
@keyframes popin { 0% { opacity: 0; transform: translateY(220px) scale(0.2) rotate(8deg); } 100% { opacity: 1; transform: none; } }
.jarbtn { position: relative; width: 170px; height: 200px; margin-top: 20px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.jar { position: absolute; inset: 22px 0 0; border: 4px solid rgba(201, 46, 105, 0.5); border-radius: 30px 30px 54px 54px; background: rgba(255, 255, 255, 0.55); overflow: hidden; }
.jar i { position: absolute; width: 38px; height: 26px; border-radius: 4px; background: #ffc2d6; border: 1px solid #ff8fb3; }
.jlid { position: absolute; left: 22px; right: 22px; top: 0; height: 24px; border-radius: 8px; background: var(--btn); }
.jarbtn:active { transform: scale(0.97); }
.jend { margin: 18px 0 0; padding: 12px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.85); text-align: center; font-weight: 700; font-size: 19px; line-height: 1.6; animation: fadeUp 0.6s both; }

/* counter */
.ctr { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 10px; }
.clead { margin: 0; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.7; }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
.tile { width: calc(33.33% - 7px); box-sizing: border-box; padding: 14px 4px 10px; border-radius: 16px; background: #ffffff; text-align: center; box-shadow: 0 6px 18px rgba(120, 10, 60, 0.15); }
.tile b { display: block; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.tile.tick b { animation: tickp 0.4s ease; }
@keyframes tickp { 0% { transform: scale(1.18); color: var(--btn); } 100% { transform: scale(1); } }

/* star sky */
.sky { display: block; width: 100%; height: auto; }
.bgstar { fill: #ffd0e0; animation: tw 3s ease-in-out infinite alternate; }
@keyframes tw { from { opacity: 0.15; } to { opacity: 0.9; } }
.mstar { fill: #7a4a68; cursor: pointer; transition: fill 0.4s; }
.mstar.lit { fill: #ffe3ec; filter: drop-shadow(0 0 6px #ff8fb3); }
.hline { fill: rgba(255, 143, 179, 0.2); stroke: #ff8fb3; stroke-width: 1.6; }
.scap { margin: 0; padding: 4px 18px 22px; min-height: 150px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.7; }
.send { margin: 0; padding: 0 18px 20px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 26px; }
.shint { margin: 0; padding: 12px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: rgba(255, 194, 214, 0.75); }

/* scratch */
.sclist { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.sc { position: relative; width: min(340px, 100%); min-height: 120px; border-radius: 18px; overflow: hidden; background: #ffffff; display: grid; place-items: center; text-align: center; box-shadow: 0 6px 18px rgba(120, 10, 60, 0.2); }
.sc-t { margin: 0; padding: 14px 18px; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.6; }
.sc canvas { position: absolute; inset: 0; touch-action: none; transition: opacity 0.6s; }
.sc.done canvas { opacity: 0; pointer-events: none; }

/* open when */
.ow { display: flex; flex-direction: column; gap: 12px; }
.ow-item { border-radius: 18px; background: #ffffff; box-shadow: 0 6px 18px rgba(120, 10, 60, 0.15); overflow: hidden; }
.ow-head { width: 100%; min-height: 60px; padding: 10px 16px; border: 0; background: none; color: var(--ink); display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.5; text-align: start; }
.ow-head svg { width: 30px; height: 30px; flex: none; transition: transform 0.4s; }
.ow-item.open .ow-head svg { transform: rotate(-12deg) scale(1.1); }
.ow-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.5s ease; }
.ow-item.open .ow-body { grid-template-rows: 1fr; }
.ow-body > div { overflow: hidden; }
.ow-body p { margin: 0; padding: 0 18px 18px; font-size: 19px; font-weight: 500; line-height: 1.85; white-space: pre-line; }

.owgate { width: 100%; box-sizing: border-box; padding: 22px 20px 20px; border-radius: 22px; background: #ffffff; box-shadow: 0 10px 30px rgba(120, 10, 60, 0.18); display: flex; flex-direction: column; align-items: stretch; gap: 12px; text-align: center; }
.owgate.shake { animation: shake 0.45s ease-in-out; }
.owl { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.5; }
.owl svg { width: 30px; height: 30px; flex: none; }
.owq { margin: 0; font-size: 18px; font-weight: 700; }
.owin { width: 100%; box-sizing: border-box; height: 56px; padding: 0 16px; border: 2px solid var(--line); border-radius: 16px; background: #ffffff; color: var(--ink); font-family: var(--font-body); font-size: 18px; font-weight: 500; outline: none; text-align: center; direction: ltr; }
.owin:focus-visible { border-color: var(--btn); box-shadow: 0 0 0 4px rgba(201, 46, 105, 0.22); }
.owgo { margin-top: 0; font-family: var(--font-body); font-size: 22px; }
.owmsg { margin: 0; min-height: 1.4em; color: var(--error); font-size: 16px; font-weight: 700; }

/* quiz */
.qz { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 6px; }
.qn { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; direction: ltr; }
.qq { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.55; text-align: center; }
.qopt { width: min(340px, 100%); min-height: 54px; padding: 8px 16px; border: 2px solid var(--line); border-radius: 16px; background: #ffffff; color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.qopt:hover:not(:disabled) { background: #fff0f5; }
.qopt.good { border-color: #2e9d5b; background: #e6f7ec; }
.qopt:disabled { opacity: 0.85; cursor: default; }
.qend { text-align: center; padding: 30px 0; }
.qend p { margin: 0; font-family: var(--font-script); font-weight: 700; font-size: 44px; line-height: 1.3; }

/* finale */
.fin { position: relative; min-height: 74vh; cursor: pointer; display: grid; place-items: center; padding: 24px 20px; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
.fvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #14040c; opacity: 1; transition: opacity 1.4s ease; pointer-events: none; user-select: none; -webkit-user-select: none; }
.fvid.dim { opacity: 0.22; }
.fspin { position: absolute; left: 50%; top: 50%; width: 46px; margin: -23px 0 0 -23px; animation: beat 1s ease-in-out infinite; }
.fin .shint { opacity: 0; transition: opacity 1s ease; }
.fin .shint.show { opacity: 0.85; }
.fin-msg { position: relative; z-index: 1; margin: 0; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.8; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
.fin-msg.show { opacity: 1; }
.fin .shint { position: absolute; inset-inline: 0; bottom: 14px; padding: 0; }
.bit { position: absolute; width: 26px; pointer-events: none; transition: transform 1.3s ease-out, opacity 1.3s ease-out; }
.bit svg { width: 100%; height: auto; display: block; }

@media (prefers-reduced-motion: reduce) {
  .fh { animation: none; bottom: auto; top: var(--y); opacity: 0.6; }
  .kb { display: none; }
  .panel, .sign, .toast { transition: none; }

}

            if (DATA.starsEnd) send.textContent = DATA.starsEnd;
            setTimeout(function () { markDone('stars'); }, reduce ? 0 : 2600);
          }, reduce ? 0 : 1200);
        }
      });
    });
    return { stop: function () {} };
  }

  /* ---------- 6 scratch cards ---------- */
  function mkScratch(root) {
    var list = el('div', 'sclist');
    DATA.scratch.forEach(function (t) { var c = el('div', 'sc', '<p class="sc-t" lang="ar" dir="rtl"></p><canvas></canvas>'); c.querySelector('p').textContent = t; list.appendChild(c); });
    root.appendChild(list);
    root.appendChild(el('p', 'hint-t', 'Scratch the cards'));
    var cards = Array.prototype.slice.call(list.querySelectorAll('.sc')), inited = false;
    cards.forEach(function (c) {
      var cv = c.querySelector('canvas'), g = cv.getContext('2d'), down = false, lx = 0, ly = 0;
      function pos(ev) { var r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
      function scratch(x, y) {
        g.globalCompositeOperation = 'destination-out';
        g.lineWidth = 34; g.lineCap = 'round';
        g.beginPath(); g.moveTo(lx, ly); g.lineTo(x + 0.01, y); g.stroke();
        lx = x; ly = y;
      }
      cv.addEventListener('pointerdown', function (ev) { ev.preventDefault(); try { cv.setPointerCapture(ev.pointerId); } catch (x) {} down = true; var p = pos(ev); lx = p[0]; ly = p[1]; scratch(p[0], p[1]); });
      cv.addEventListener('pointermove', function (ev) { if (!down) return; var p = pos(ev); scratch(p[0], p[1]); });
      function end() {
        if (!down) return;
        down = false;
        var data = g.getImageData(0, 0, cv.width, cv.height).data, clear = 0, total = 0;
        for (var i = 3; i < data.length; i += 32) { total++; if (data[i] < 30) clear++; }
        if (clear / total > 0.5) c.classList.add('done');
        if (cards.every(function (x) { return x.classList.contains('done'); })) markDone('scratch');
      }
      cv.addEventListener('pointerup', end);
      cv.addEventListener('pointercancel', end);
    });
    function init() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cards.forEach(function (c) {
        var cv = c.querySelector('canvas'), r = c.getBoundingClientRect(), g = cv.getContext('2d');
        cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
        cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.globalCompositeOperation = 'source-over';
        var gr = g.createLinearGradient(0, 0, r.width, r.height);
        gr.addColorStop(0, '#ffb3cb'); gr.addColorStop(0.5, '#ff9ec0'); gr.addColorStop(1, '#ff8fb3');
        g.fillStyle = gr; g.fillRect(0, 0, r.width, r.height);
        g.fillStyle = 'rgba(255,255,255,0.5)';
        for (var i = 0; i < 30; i++) { g.beginPath(); g.arc(Math.random() * r.width, Math.random() * r.height, Math.random() * 2 + 0.6, 0, 6.3); g.fill(); }
        g.fillStyle = '#6b123a'; g.font = '700 20px Tajawal, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('Scratch here', r.width / 2, r.height / 2);
      });
    }
    return { start: function () { if (!inited) { inited = true; init(); } }, stop: function () {} };
  }

  /* ---------- 7 open when ---------- */
  function mkOpenWhen(root) {
    var envI = '<svg viewBox="0 0 28 28" fill="none" stroke="#c92e69" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="22" height="16" rx="3"/><path d="M3 8l11 8 11-8"/></svg>';
    var lockI = '<svg viewBox="0 0 28 28" fill="none" stroke="#c92e69" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="5" y="12" width="18" height="12" rx="3"/><path d="M9 12V9a5 5 0 0 1 10 0v3"/></svg>';
    var wrap = el('div', 'ow');
    var gateEl = el('form', 'owgate', '<div class="owl">' + lockI + '<span lang="ar" dir="rtl"></span></div><p class="owq">Enter the password</p><input class="owin" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Password" aria-label="Password"><button class="go owgo" type="submit">Open</button><p class="owmsg" role="alert"></p>');
    gateEl.querySelector('.owl span').textContent = DATA.openwhen[0].t;
    var inp = gateEl.querySelector('.owin'), omsg = gateEl.querySelector('.owmsg'), obtn = gateEl.querySelector('.owgo');
    root.appendChild(gateEl);
    function showLetters(bodies) {
      DATA.openwhen.forEach(function (d, i) {
        var it = el('div', 'ow-item', '<button class="ow-head" type="button" aria-expanded="false" lang="ar" dir="rtl">' + envI + '<span></span></button><div class="ow-body"><div><p lang="ar" dir="rtl"></p></div></div>');
        it.querySelector('span').textContent = d.t;
        it.querySelector('p').textContent = bodies[i];
        var b = it.querySelector('button');
        b.addEventListener('click', function () { var o = it.classList.toggle('open'); b.setAttribute('aria-expanded', o ? 'true' : 'false'); if (o) markDone('openwhen'); });
        wrap.appendChild(it);
      });
      gateEl.hidden = true;
      root.appendChild(wrap);
      root.appendChild(el('p', 'hint-t', 'Tap the letter'));
    }
    inp.addEventListener('input', function () { omsg.textContent = ''; });
    gateEl.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = inp.value; if (!v || obtn.disabled) return;
      obtn.disabled = true;
      var OW = CFG.ow;
      crypto.subtle.importKey('raw', new TextEncoder().encode(norm(v)), 'PBKDF2', false, ['deriveKey']).then(function (k) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(OW.salt), iterations: CFG.iter, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (k) { return decrypt(k, b64(OW.d)); }).then(function (buf) {
        showLetters(JSON.parse(new TextDecoder().decode(buf)));
      }, function () {
        obtn.disabled = false;
        omsg.textContent = 'That is not the password. Try again.';
        gateEl.classList.remove('shake'); void gateEl.offsetWidth; gateEl.classList.add('shake');
        inp.select();
      });
    });
    return { start: function () { if (!gateEl.hidden) { try { inp.focus({ preventScroll: true }); } catch (x) {} } }, stop: function () {} };
  }

  /* ---------- 8 quiz ---------- */
  function mkQuiz(root) {
    var Q = DATA.quiz, qs = Q.questions, idx = 0, lock = false, tm = 0;
    var box = el('div', 'qz');
    root.appendChild(box);
    function render() {
      lock = false;
      if (idx >= qs.length) {
        box.innerHTML = '<div class="qend"><p lang="en"></p></div>';
        box.querySelector('p').textContent = Q.end;
        var r = box.getBoundingClientRect();
        spawn(30, true);
        markDone('quiz');
        return;
      }
      var q = qs[idx];
      box.innerHTML = '<p class="qn" lang="en">Question ' + (idx + 1) + ' / ' + qs.length + '</p><p class="qq" lang="ar" dir="rtl"></p>';
      box.querySelector('.qq').textContent = q.q;
      q.o.forEach(function (t, i) {
        var b = el('button', 'qopt'); b.type = 'button'; b.textContent = t; b.setAttribute('lang', 'ar'); b.setAttribute('dir', 'rtl');
        b.addEventListener('click', function () {
          if (lock) return;
          if (i === q.a) {
            lock = true; b.classList.add('good');
            Array.prototype.forEach.call(box.querySelectorAll('.qopt'), function (x) { x.disabled = true; });
            say(q.right, 3200, function () { idx += 1; render(); });
          } else {
            say(q.wrong, 1500);
          }
        });
        box.appendChild(b);
      });
    }
    render();
    return { stop: function () {} };
  }

  /* ---------- 9 finale ---------- */
  function mkFinale(root) {
    root.innerHTML = '<div class="panel-night"><div class="fin" id="fin"><video class="fvid" id="fvid" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video><div class="fspin">' + LOGO + '</div><p class="fin-msg" id="fm" lang="ar" dir="rtl"></p><p class="shint" id="fh">Tap anywhere for more fireworks</p></div></div>';
    var fin = root.querySelector('#fin'), fm = root.querySelector('#fm'), fv = root.querySelector('#fvid'), fsp = root.querySelector('.fspin'), fh = root.querySelector('#fh');
    var timers = [], ready = false, token = 0, vurl = null;
    fm.textContent = DATA.finale;
    fv.controls = false; fv.loop = false; fv.muted = true; fv.defaultMuted = true;
    ['contextmenu', 'dblclick'].forEach(function (ev) { fv.addEventListener(ev, function (e) { e.preventDefault(); }); });
    function burst(x, y) {
      for (var i = 0; i < 16; i++) {
        var b = el('div', 'bit', LOGO);
        b.style.left = (x - 13) + 'px'; b.style.top = (y - 13) + 'px';
        fin.appendChild(b);
        (function (n, k) {
          var a = k / 16 * 6.28 + Math.random() * 0.3, dd = rnd(80, 150);
          requestAnimationFrame(function () {
            void n.offsetWidth;
            n.style.transform = 'translate(' + Math.cos(a) * dd + 'px,' + Math.sin(a) * dd + 'px) scale(1.4)';
            n.style.opacity = '0';
          });
          setTimeout(function () { n.remove(); }, 1400);
        })(b, i);
      }
    }
    fin.addEventListener('pointerdown', function (ev) { if (!ready) return; var r = fin.getBoundingClientRect(); burst(ev.clientX - r.left, ev.clientY - r.top); });
    function clearT() { timers.forEach(clearTimeout); timers = []; }
    // after the video's last second: dim it so the focus moves to the hearts, then the old sequence runs as before
    function afterVideo(my) {
      if (my !== token || ready) return;
      ready = true;
      fsp.hidden = true;
      fv.classList.add('dim');
      fh.classList.add('show');
      var r = fin.getBoundingClientRect();
      [[0.3, 0.22], [0.72, 0.18], [0.5, 0.5], [0.22, 0.72], [0.78, 0.7]].forEach(function (p, i) {
        timers.push(setTimeout(function () { burst(r.width * p[0], r.height * p[1]); }, T(1300 + i * 700)));
      });
      timers.push(setTimeout(function () { fm.classList.add('show'); }, T(3500)));
    }
    return {
      start: function () {
        clearT(); var my = ++token;
        ready = false; fm.classList.remove('show'); fv.classList.remove('dim'); fh.classList.remove('show'); fsp.hidden = false;
        try { fv.pause(); } catch (e) {}
        var done = false;
        function end() { if (done) return; done = true; afterVideo(my); }
        fv.onended = end;
        fv.onerror = function () { setTimeout(end, 300); };
        fv.onloadedmetadata = function () {
          if (isFinite(fv.duration)) timers.push(setTimeout(end, fv.duration * 1000 + 3000));
        };
        timers.push(setTimeout(end, 25000));
        media(DATA.finalVideo, 'video/mp4').then(function (url) {
          if (my !== token) return;
          if (vurl !== url) { vurl = url; fv.src = url; }
          try { fv.currentTime = 0; } catch (e) {}
          var pr = fv.play();
          if (pr && pr.then) pr.then(function () { if (my === token) fsp.hidden = true; }).catch(function () { end(); });
        }).catch(function () { end(); });
      },
      stop: function () { token++; clearT(); try { fv.pause(); } catch (e) {} }
    };
  }

  /* ---------- music: starts on her first touch, loops, never stops between screens ---------- */
  var muted = false, started = false, ctxA = null, gainNode = null, srcNode = null, audioEl = null, loadingSong = false;
  var VOL = 0.8;
  function applyVolume() {
    var v = muted ? 0 : (player.ducked ? VOL * 0.08 : VOL);
    if (gainNode) { try { gainNode.gain.setTargetAtTime(v, ctxA.currentTime, 0.08); } catch (e) { gainNode.gain.value = v; } }
    if (audioEl) audioEl.volume = v;
  }
  function startAudioElement() {
    audioEl = new Audio(CFG.song);
    audioEl.loop = true;
    applyVolume();
    var p = audioEl.play(); if (p && p.catch) p.catch(function () { started = false; });
  }
  function startMusic() {
    if (started) return;
    started = true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !window.fetch) { startAudioElement(); return; }
    try {
      ctxA = new AC();
      gainNode = ctxA.createGain();
      gainNode.connect(ctxA.destination);
      applyVolume();
      fetch(CFG.song).then(function (r) { if (!r.ok) throw new Error('song'); return r.arrayBuffer(); }).then(function (b) {
        return new Promise(function (res, rej) { ctxA.decodeAudioData(b, res, rej); });
      }).then(function (buf) {
        srcNode = ctxA.createBufferSource();
        srcNode.buffer = buf; srcNode.loop = true;
        srcNode.connect(gainNode);
        srcNode.start(0);
      }).catch(function () {
        try { ctxA.close(); } catch (e) {}
        ctxA = null; gainNode = null;
        startAudioElement();
      });
    } catch (e) { startAudioElement(); }
  }
  function resumeMusic() {
    if (ctxA && ctxA.state !== 'running') ctxA.resume();
    if (audioEl && audioEl.paused) audioEl.play().catch(function () {});
  }
  ['pointerdown', 'touchend', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { startMusic(); resumeMusic(); }, { passive: true });
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) resumeMusic(); });
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.classList.toggle('muted', muted);
    muteBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    muteBtn.setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music');
    applyVolume();
  });
})();
